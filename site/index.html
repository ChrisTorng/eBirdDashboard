<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176950"><title>eBird Dashboard</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"></head><body><header><strong>eBird Dashboard</strong><button id="openImport">匯入資料</button></header><main><aside><h2>觀察地點 <small id="locationCount"></small></h2><input id="search" type="search" placeholder="搜尋地點" aria-label="搜尋地點"><div id="locations"></div></aside><section id="content"><div id="status" role="status">載入中…</div><button id="choose" class="mobile">選擇地點 ▾</button><section class="panel"><div class="heading"><h1 id="place">觀察地點</h1><a id="placeLink" target="_blank" rel="noopener noreferrer" hidden>eBird 地點 ↗</a></div><div class="periods" id="periods"><button data-days="30">近一月</button><button data-days="90">近三月</button><button data-days="180">近半年</button><button data-days="365">近一年</button><button data-days="all">全部</button><button data-days="custom">自訂</button></div><div id="custom" hidden><label>開始 <input type="date" id="from"></label><label>結束 <input type="date" id="to"></label><button id="apply">套用</button></div><div class="metrics"><div>鳥種數（暫估）<strong id="species" class="green">—</strong></div><div>已計數個體<strong id="individuals" class="blue">—</strong></div><div>區間回報<strong id="visits">—</strong></div></div><div id="chart" aria-label="觀察趨勢圖"></div><p class="note" id="hint">點選曲線查看詳細清單。拖曳圖表下方時間軸縮放。</p></section><section class="panel"><div class="heading"><h2>回報詳細紀錄</h2><a id="checklistLink" target="_blank" rel="noopener noreferrer" hidden>eBird 原始清單 ↗</a></div><div class="navigation"><button id="prev" aria-label="前一次">←</button><select id="checklists" aria-label="選擇觀察日期"></select><button id="next" aria-label="後一次">→</button></div><p id="meta" class="note"></p><div id="details"></div></section><p class="note">鳥種數以學名暫估，亞種合併，排除未辨識到種的分類群。X 為未計數，個體數只加總已知數量。同日多次觀察不合併，未觀察日期不視為零。</p></section></main><dialog id="locationDialog"><div class="heading"><h2>選擇地點</h2><button id="closeLocation">關閉</button></div><input id="mobileSearch" type="search" placeholder="搜尋地點" aria-label="搜尋地點"><div id="mobileLocations"></div></dialog><dialog id="importDialog"><div class="heading"><h2>匯入個人資料</h2><button id="closeImport">關閉</button></div><p>選擇 <a href="https://ebird.org/downloadMyData" target="_blank" rel="noopener noreferrer">eBird 官方下載</a> 的 ZIP 或 CSV。</p><input id="file" type="file" accept=".zip,.csv"><p id="importStatus" role="status"></p><progress id="progress" max="100" value="0" hidden></progress><div class="navigation"><button id="preview" disabled>本機預覽</button><button id="upload" disabled>同步至雲端</button></div><p class="note">同一回報 ID 更新原資料，不自動刪除歷史紀錄。不將個人資料存入 Git。</p></dialog><script src="./vendor/echarts.min.js"></script><script src="./vendor/papaparse.min.js"></script><script src="./vendor/fflate.js"></script><script type="module" src="./app.mjs"></script></body></html>
